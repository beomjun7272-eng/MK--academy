<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D 단어 문 통과</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><style>html,body{margin:0;height:100%;overflow:hidden;background:#06101e;color:white;font-family:Arial}#ui{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:15px}.card{background:#071a31dd;border:1px solid #65e7ff;border-radius:12px;padding:9px 13px}.q{position:fixed;top:72px;width:100%;text-align:center;font-size:clamp(28px,6vw,56px);font-weight:bold}.timer{position:fixed;top:140px;left:25%;width:50%;height:9px;background:#23344e}.timer i{display:block;height:100%;background:#ff6680;transform-origin:left}.door{position:fixed;bottom:18%;width:42%;text-align:center;font-size:clamp(20px,4vw,38px);font-weight:bold;text-shadow:0 3px 10px #000}.l{left:2%}.r{right:2%}.help{position:fixed;bottom:4%;width:100%;text-align:center}.heart{color:#ff7890}</style></head><body><div id="ui"><div class="top"><span class="card">점수 <b id="score">0</b></span><span class="card heart" id="life">♥ ♥ ♥</span><span class="card">방향키로 이동</span></div><div id="q" class="q"></div><div class="timer"><i id="bar"></i></div><div id="left" class="door l"></div><div id="right" class="door r"></div><div class="help">실제 사람 캐릭터를 움직여 정답 문을 통과하세요</div></div><script type="module">import*as T from'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';const Q=[['Sustainable','지속 가능한'],['Achieve','성취하다'],['Environment','환경'],['Opportunity','기회']];const $=x=>document.getElementById(x),keys={};let score=0,life=3,i=0,answer=0,end=0,busy=false,player,mixer,idle,walk,action;const s=new T.Scene(),c=new T.PerspectiveCamera(60,innerWidth/innerHeight,.1,100),r=new T.WebGLRenderer({antialias:true,powerPreference:'low-power'});r.setPixelRatio(Math.min(devicePixelRatio,1.25));r.setSize(innerWidth,innerHeight);document.body.prepend(r.domElement);s.background=new T.Color(0x06101e);s.add(new T.HemisphereLight(0xaeefff,0x06101e,2));c.position.set(0,3.4,8);let f=new T.Mesh(new T.PlaneGeometry(16,50),new T.MeshStandardMaterial({color:0x153154}));f.rotation.x=-Math.PI/2;f.position.z=-20;s.add(f);for(const[x,col]of[[-2.7,0xa885ff],[2.7,0x65e7ff]]){let d=new T.Mesh(new T.BoxGeometry(2.3,3.3,.35),new T.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:.5}));d.position.set(x,1.65,-7);s.add(d)}new GLTFLoader().load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/Soldier.glb',g=>{player=g.scene;player.position.y=0;player.scale.setScalar(1);s.add(player);mixer=new T.AnimationMixer(player);idle=mixer.clipAction(g.animations[0]);walk=mixer.clipAction(g.animations[1]);action=idle;idle.play()},undefined,()=>{$('q').textContent='모델 로딩 실패: 새로고침하세요'});function next(){let a=Q[i++%Q.length],b=Q[(i+1)%Q.length];answer=Math.random()<.5?0:1;let v=answer?[b[0],a[0]]:[a[0],b[0]];$('q').textContent=a[1];$('left').textContent=v[0];$('right').textContent=v[1];end=performance.now()+6000;if(player)player.position.set(0,0,0)}function fail(){if(busy)return;busy=true;life--;$('life').textContent='♥ '.repeat(life)+'♡ '.repeat(3-life);setTimeout(()=>{if(!life){life=3;score=0;$('score').textContent=0;$('life').textContent='♥ ♥ ♥'}busy=false;next()},700)}function loop(t){let dt=.016,rem=Math.max(0,end-t);$('bar').style.transform=`scaleX(${rem/6000})`;let dx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),dz=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0),move=dx||dz;if(player&&!busy){player.position.x=T.MathUtils.clamp(player.position.x+dx*dt*5,-4,4);player.position.z=T.MathUtils.clamp(player.position.z+dz*dt*5,-8,3);if(move)player.rotation.y=Math.atan2(dx,dz);let target=move?walk:idle;if(target&&target!==action){target.reset().play();action.fadeOut(.15);action=target}if(player.position.z<-6.2&&Math.abs(player.position.x)>1.3){busy=true;if((player.position.x<0?0:1)===answer){score+=100;$('score').textContent=score}else{life--; $('life').textContent='♥ '.repeat(life)+'♡ '.repeat(3-life)}setTimeout(()=>{busy=false;next()},600)}}if(rem===0&&!busy)fail();if(mixer)mixer.update(dt);c.position.x+=(player?.position.x||0-c.position.x)*.08;c.lookAt(player?.position.x||0,1,-3);r.render(s,c);requestAnimationFrame(loop)}addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);next();requestAnimationFrame(loop);</script></body></html>
