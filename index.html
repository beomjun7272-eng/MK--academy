<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D 영단어 문 통과</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#06101e;color:#fff;font-family:system-ui}#ui{position:fixed;inset:0;pointer-events:none}canvas{display:block}.top{display:flex;justify-content:space-between;padding:14px;font-weight:bold}.pill,button{pointer-events:auto;background:#071a31dd;border:1px solid #68eaff;border-radius:14px;padding:9px 12px;color:#fff}.question{position:fixed;top:72px;width:100%;text-align:center;font-size:clamp(28px,6vw,56px);font-weight:900;color:#c6f7ff;text-shadow:0 3px 13px #000}.timer{position:fixed;top:142px;left:25%;width:50%;height:10px;border-radius:9px;overflow:hidden;background:#20304d}.timer i{display:block;height:100%;background:linear-gradient(90deg,#ff607c,#ffd166);transform-origin:left}.door{position:fixed;bottom:17%;width:40%;text-align:center;font-size:clamp(20px,4vw,38px);font-weight:900;text-shadow:0 3px 12px #000}.l{left:3%}.r{right:3%}.hint{position:fixed;bottom:4%;width:100%;text-align:center}.heart{color:#ff7890}.note{position:fixed;inset:12% 16%;display:none;pointer-events:auto;background:#071a31f7;border:1px solid #68eaff;border-radius:18px;padding:20px;overflow:auto}.note.show{display:block}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #ffffff33;text-align:left}.banner{position:fixed;top:46%;width:100%;text-align:center;font-size:44px;font-weight:900;opacity:0;transition:.2s}.banner.on{opacity:1}@media(max-width:600px){.top{font-size:12px}.door{bottom:21%}}</style></head><body><div id="ui"><div class="top"><span class="pill">점수 <b id="score">0</b></span><span class="pill heart" id="life">♥ ♥ ♥</span><button id="notes">오답노트</button></div><div id="q" class="question"></div><div class="timer"><i id="bar"></i></div><div id="left" class="door l"></div><div id="right" class="door r"></div><div class="hint">← → 키 또는 좌·우 화면을 눌러 문을 고르세요</div><div id="banner" class="banner"></div><section id="note" class="note"><button id="close">닫기</button><h2>오답노트</h2><table><tbody id="rows"></tbody></table></section></div><script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script><script type="module">import*as T from'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';import Dexie from'https://cdn.jsdelivr.net/npm/dexie@latest/dist/modern/dexie.mjs';const W=[['Sustainable','지속 가능한'],['Achieve','성취하다'],['Environment','환경'],['Opportunity','기회'],['Consider','고려하다'],['Essential','필수적인'],['Improve','개선하다'],['Challenge','도전'],['Knowledge','지식']];const $=x=>document.getElementById(x),db=new Dexie('doorNotes');db.version(1).stores({wrong:'word,meaning,count'});let score=0,life=3,n=0,correct=0,busy=false,end=0;const s=new T.Scene(),c=new T.PerspectiveCamera(60,innerWidth/innerHeight,.1,100),r=new T.WebGLRenderer({antialias:true,powerPreference:'low-power'});r.setPixelRatio(Math.min(devicePixelRatio,1.25));r.setSize(innerWidth,innerHeight);document.body.prepend(r.domElement);c.position.set(0,3,8);c.lookAt(0,1,0);s.add(new T.HemisphereLight(0x9eefff,0x06101e,2));let lines=[];const floor=new T.Mesh(new T.PlaneGeometry(18,90),new T.MeshStandardMaterial({color:0x13294b}));floor.rotation.x=-Math.PI/2;floor.position.z=-30;s.add(floor);for(let z=5;z>-60;z-=4){let x=new T.Mesh(new T.BoxGeometry(10,.04,.1),new T.MeshBasicMaterial({color:0x53dfff}));x.position.set(0,.02,z);s.add(x);lines.push(x)}const p=new T.Mesh(new T.CapsuleGeometry(.35,.8,5,10),new T.MeshStandardMaterial({color:0x62e7ff,emissive:0x07556d,emissiveIntensity:1}));p.position.y=.8;s.add(p);function mk(x,col){let m=new T.Mesh(new T.BoxGeometry(2.3,3.4,.4),new T.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:.45}));m.position.set(x,1.7,-5);s.add(m)}mk(-2.7,0xa885ff);mk(2.7,0x62e7ff);function next(){let a=W[n++%W.length],b=W.find(x=>x!==a);correct=Math.random()<.5?0:1;let v=correct?[b[0],a[0]]:[a[0],b[0]];$('q').textContent=a[1];$('left').textContent=v[0];$('right').textContent=v[1];window.cur=a;end=performance.now()+5000;p.position.set(0,.8,0)}function flash(t,col){let e=$('banner');e.textContent=t;e.style.color=col;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),550)}async function fail(){let o=await db.wrong.get(cur[0]);await db.wrong.put({word:cur[0],meaning:cur[1],count:(o?.count||0)+1});life--;$('life').textContent='♥ '.repeat(life)+'♡ '.repeat(3-life);flash('오답!','#ff738a');if(!life){flash('GAME OVER','#ff738a');setTimeout(()=>{life=3;score=0;$('life').textContent='♥ ♥ ♥';next()},1000)}else setTimeout(next,650)}function choose(x){if(busy)return;busy=true;let t=x?2.7:-2.7,k=0;function go(){k+=.08;p.position.x=t*Math.min(1,k);p.position.z=-5*Math.min(1,k);if(k<1)return requestAnimationFrame(go);if(x===correct){score+=100;$('score').textContent=score;flash('정답!','#6ff5ab');confetti?.({particleCount:38,spread:55,origin:{y:.65}});setTimeout(next,600)}else fail();setTimeout(()=>busy=false,750)}go()}$('notes').onclick=async()=>{let a=await db.wrong.toArray();$('rows').innerHTML=a.map(x=>`<tr><td>${x.word}</td><td>${x.meaning}</td><td>${x.count}회</td></tr>`).join('')||'<tr><td>아직 오답이 없습니다.</td></tr>';$('note').classList.add('show')};$('close').onclick=()=>$('note').classList.remove('show');addEventListener('keydown',e=>{if(e.key==='ArrowLeft')choose(0);if(e.key==='ArrowRight')choose(1)});r.domElement.onclick=e=>choose(e.clientX>innerWidth/2?1:0);function loop(){let rem=Math.max(0,end-performance.now());$('bar').style.transform=`scaleX(${rem/5000})`;if(!busy&&rem===0)choose(9);for(let x of lines){x.position.z+=.1;if(x.position.z>6)x.position.z=-58}p.rotation.y=Math.sin(performance.now()/200)*.1;r.render(s,c);requestAnimationFrame(loop)}next();loop();</script></body></html>
