<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D 단어 문 통과</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><style>html,body{margin:0;height:100%;overflow:hidden;background:#06101e;color:#fff;font-family:Arial}#ui{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:15px}.card{background:#071a31dd;border:1px solid #65e7ff;border-radius:12px;padding:9px 13px}.q{position:fixed;top:70px;width:100%;text-align:center;font-size:clamp(28px,6vw,56px);font-weight:bold}.bar{position:fixed;top:140px;left:25%;width:50%;height:9px;background:#23344e}.bar i{display:block;height:100%;background:#ff6680;transform-origin:left}.door{position:fixed;bottom:18%;width:42%;font-size:clamp(20px,4vw,38px);font-weight:bold;text-align:center;text-shadow:0 3px 10px #000}.l{left:2%}.r{right:2%}.help{position:fixed;bottom:4%;width:100%;text-align:center}.heart{color:#ff7890}</style></head><body><div id="ui"><div class="top"><span class="card">점수 <b id="score">0</b></span><span class="card heart" id="life">♥ ♥ ♥</span><span class="card">방향키로 사람만 이동</span></div><div id="q" class="q"></div><div class="bar"><i id="timer"></i></div><div id="left" class="door l"></div><div id="right" class="door r"></div><div class="help">화면은 고정 · 사람 캐릭터만 움직입니다</div></div><script type="module">import*as T from'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';const W=[['Sustainable','지속 가능한'],['Achieve','성취하다'],['Environment','환경'],['Opportunity','기회']];const $=x=>document.getElementById(x),keys={};let p,mixer,idle,walk,act,score=0,life=3,correct=0,n=0,end=0,busy=false;const s=new T.Scene(),c=new T.PerspectiveCamera(60,innerWidth/innerHeight,.1,100),r=new T.WebGLRenderer({antialias:true,powerPreference:'low-power'});r.setPixelRatio(Math.min(devicePixelRatio,1.2));r.setSize(innerWidth,innerHeight);document.body.prepend(r.domElement);s.background=new T.Color(0x06101e);s.add(new T.HemisphereLight(0xafffff,0x06101e,2));c.position.set(0,3.4,8);c.lookAt(0,1,-3);let floor=new T.Mesh(new T.PlaneGeometry(16,35),new T.MeshStandardMaterial({color:0x153154}));floor.rotation.x=-Math.PI/2;floor.position.z=-10;s.add(floor);for(const[x,col]of[[-2.7,0xa885ff],[2.7,0x65e7ff]]){let d=new T.Mesh(new T.BoxGeometry(2.3,3.3,.35),new T.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:.5}));d.position.set(x,1.65,-7);s.add(d)}new GLTFLoader().load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/Soldier.glb',g=>{p=g.scene;p.position.set(0,0,0);s.add(p);mixer=new T.AnimationMixer(p);idle=mixer.clipAction(g.animations[0]);walk=mixer.clipAction(g.animations[1]);act=idle;idle.play()},undefined,()=>{$('q').textContent='사람 모델을 불러오지 못했습니다. 새로고침하세요'});function next(){let a=W[n++%W.length],b=W[n%W.length];correct=Math.random()<.5?0:1;let v=correct?[b[0],a[0]]:[a[0],b[0]];$('q').textContent=a[1];$('left').textContent=v[0];$('right').textContent=v[1];end=performance.now()+6000;if(p)p.position.set(0,0,0)}function lose(){if(busy)return;busy=true;life--;$('life').textContent='♥ '.repeat(life)+'♡ '.repeat(3-life);setTimeout(()=>{if(!life){life=3;score=0;$('score').textContent=0;$('life').textContent='♥ ♥ ♥'}busy=false;next()},700)}function loop(t){let dt=.016,rem=Math.max(0,end-t),dx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),dz=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0),moving=dx||dz;$('timer').style.transform=`scaleX(${rem/6000})`;if(p&&!busy){p.position.x=T.MathUtils.clamp(p.position.x+dx*dt*4,-4,4);p.position.z=T.MathUtils.clamp(p.position.z+dz*dt*4,-8,3);if(moving)p.rotation.y=Math.atan2(dx,dz);let a=moving?walk:idle;if(a&&a!==act){a.reset().play();act.fadeOut(.12);act=a}if(p.position.z<-6.2&&Math.abs(p.position.x)>1.3){busy=true;if((p.position.x<0?0:1)===correct){score+=100;$('score').textContent=score;setTimeout(()=>{busy=false;next()},500)}else lose()}}if(rem===0&&!busy)lose();if(mixer)mixer.update(dt);r.render(s,c);requestAnimationFrame(loop)}addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);next();requestAnimationFrame(loop);</script></body></html>
