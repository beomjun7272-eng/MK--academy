<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b24">
  <title>영단어 퀴즈 서바이벌 게임</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <style>
    :root{--cyan:#62e7ff;--violet:#a885ff;--green:#6ff5ab;--danger:#ff6f86;--ink:#070b24;--card:#101837d9;--muted:#b7c3dc}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 0,#4b2b78 0,transparent 32%),radial-gradient(circle at 90% 80%,#064d68 0,transparent 35%),#070b24;color:#f7f9ff;font-family:Pretendard,Inter,system-ui,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:linear-gradient(#90b1d622 1px,transparent 1px),linear-gradient(90deg,#90b1d622 1px,transparent 1px);background-size:52px 52px;mask-image:linear-gradient(to bottom,black,transparent)}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid #fff;outline-offset:4px}.hidden{display:none!important}#app{min-height:100vh;display:grid;place-items:center;padding:24px 18px;position:relative}.screen{width:min(980px,100%);text-align:center}.topbar{position:fixed;top:18px;right:18px;display:flex;gap:9px;z-index:2}.icon-button{width:44px;height:44px;border:1px solid #6ae7ff66;border-radius:14px;background:#101837b8;display:grid;place-items:center}.icon-button:hover{background:#1c315f}.eyebrow,.stat-label{color:#c5b7ef;letter-spacing:.24em;font-size:12px;font-weight:750}.logo{display:inline-flex;align-items:center;gap:9px;color:var(--cyan);font-size:clamp(13px,2vw,17px);font-weight:850;letter-spacing:.09em}.logo i{width:19px;height:19px}h1{margin:17px auto;color:var(--cyan);font-size:clamp(40px,7vw,76px);line-height:1.1;letter-spacing:-.045em;text-shadow:0 0 12px #00d9ffcc,0 0 42px #00bde877}.subtitle{max-width:580px;margin:0 auto 44px;color:var(--muted);font-size:clamp(16px,2vw,21px);line-height:1.65}.start,.retry{border:1px solid #75eeff;border-radius:23px;background:linear-gradient(110deg,#155878,#42256e);box-shadow:0 0 28px #00cbeb66,inset 0 0 24px #83e8ff22;font-size:clamp(21px,3vw,31px);font-weight:850;min-height:92px;padding:18px 38px;transition:transform .2s,filter .2s}.start:hover,.retry:hover,.answer:hover{transform:translateY(-3px);filter:brightness(1.15)}.start span{vertical-align:middle;margin-right:10px}.best-home{margin:25px 0 0;color:#b6c0d9}.best-home strong{display:block;color:#fff;font-size:31px;margin-top:4px}.tips{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin:35px 0 0}.tip{border:1px solid #ffffff1c;border-radius:999px;padding:8px 12px;background:#1018378c;color:#cdd6eb;font-size:13px}.hud{margin:0 auto 19px;padding:16px 22px;border:1px solid #62e7ff61;border-radius:25px;display:flex;justify-content:space-between;gap:15px;text-align:left;background:#0d1534cc;box-shadow:0 0 27px #00c8eb21}.stat{min-width:55px}.stat-label{display:block;font-size:10px;color:#9fa9c5}.stat-value{display:block;font-size:27px;font-weight:850;margin-top:5px}.score{color:var(--cyan)}.combo{color:var(--violet)}.timer-wrap{height:16px;border-radius:99px;overflow:hidden;background:#15143d;margin:0 2px 42px;border:1px solid #4c407e}.timer{height:100%;width:100%;transform-origin:left;background:linear-gradient(90deg,#ff5364,#ffae5d);box-shadow:0 0 16px #f14e50}.quiz-card{border:1px solid #62e7ff66;border-radius:31px;padding:clamp(42px,7vw,72px) 25px;min-height:265px;display:grid;place-items:center;background:linear-gradient(135deg,#15224add,#07152ddd);box-shadow:0 0 40px #00c7ee24}.prompt{color:#aeb9d2;font-size:14px;letter-spacing:.22em;margin:0 0 18px}.meaning{margin:0;color:var(--cyan);text-shadow:0 0 15px #00d9ffbb;font-size:clamp(36px,6vw,68px);letter-spacing:-.04em}.answers{display:grid;grid-template-columns:1fr 1fr;gap:17px;margin-top:25px}.answer{min-height:112px;border:1px solid #4eddfc;border-radius:22px;background:linear-gradient(110deg,#104661d9,#292158d9);box-shadow:0 0 22px #00d1f033;font-weight:800;font-size:clamp(20px,3vw,29px);padding:12px;transition:transform .2s,filter .2s,background .2s}.key{color:#a8efff;display:block;font-size:11px;letter-spacing:.14em;margin-bottom:8px}.help{color:#a8b4ce;font-size:14px;margin:19px 0 0}.correct{border-color:var(--green)!important;background:#155b4ad9!important}.wrong{border-color:var(--danger)!important;background:#6a233cd9!important}.result-card{border:1px solid #62e7ff77;border-radius:32px;padding:clamp(38px,6vw,58px) 25px;background:#0c1635e8;box-shadow:0 0 45px #00d9ff35}.result-card h2{color:var(--cyan);font-size:clamp(34px,6vw,60px);margin:8px 0}.result-card p{color:#b5c1dc;font-size:18px}.final-score{font-size:70px;color:#fff;font-weight:900;margin:15px}.result-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.retry{min-height:62px;font-size:18px}.footer{margin-top:22px;color:#8491b2;font-size:12px}.footer a{color:#aeeeff}.pulse{animation:pulse .45s ease}@keyframes pulse{50%{transform:scale(1.045)}}@media(max-width:620px){#app{padding:18px 13px}.topbar{top:12px;right:12px}.hud{padding:14px;gap:8px}.stat-value{font-size:21px}.timer-wrap{margin-bottom:28px}.answers{grid-template-columns:1fr;gap:11px}.answer{min-height:78px}.quiz-card{min-height:210px;padding:35px 15px}.help{margin:14px 0}.tips{margin-top:24px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="topbar"><button class="icon-button" id="sound-toggle" aria-label="효과음 켜기" aria-pressed="true"><i data-lucide="volume-2"></i></button></div>
  <main id="app">
    <section id="home" class="screen"><div class="logo"><i data-lucide="sparkles"></i> VOCABULARY SURVIVAL</div><p class="eyebrow">5 SECOND CHALLENGE</p><h1>영단어 퀴즈<br>서바이벌 게임</h1><p class="subtitle">제한 시간 안에 올바른 영단어를 골라 콤보를 쌓으세요. 점수가 오를수록 더 빨라집니다.</p><button class="start" id="start"><span>▶</span>게임 시작</button><p class="best-home">최고 점수<strong id="home-best">0</strong></p><div class="tips"><span class="tip">← → 키로 선택</span><span class="tip">연속 정답 = 보너스</span><span class="tip">5초 제한</span></div></section>
    <section id="game" class="screen hidden" aria-live="polite"><div class="hud"><div class="stat"><span class="stat-label">SCORE</span><strong class="stat-value score" id="score">0</strong></div><div class="stat"><span class="stat-label">WAVE</span><strong class="stat-value" id="wave">1</strong></div><div class="stat"><span class="stat-label">COMBO</span><strong class="stat-value combo" id="combo">0</strong></div><div class="stat"><span class="stat-label">BEST</span><strong class="stat-value" id="best">0</strong></div></div><div class="timer-wrap" aria-label="남은 시간"><div class="timer" id="timer"></div></div><div class="quiz-card" id="quiz-card"><div><p class="prompt">한국어 뜻에 맞는 영단어를 고르세요</p><h2 class="meaning" id="meaning"></h2></div></div><div class="answers"><button class="answer" id="left"><span class="key">◀ LEFT</span><span></span></button><button class="answer" id="right"><span class="key">RIGHT ▶</span><span></span></button></div><p class="help">키보드 <b>←</b> / <b>→</b> 로도 선택할 수 있습니다</p></section>
    <section id="result" class="screen hidden"><div class="result-card"><i data-lucide="trophy" style="color:#ffe17a;width:42px;height:42px"></i><p class="eyebrow">RUN COMPLETE</p><h2 id="result-title">생존 종료</h2><p id="result-copy">다시 도전해 보세요.</p><div class="final-score" id="final-score">0</div><div class="result-actions"><button class="retry" id="retry"><i data-lucide="rotate-ccw"></i> 다시 시작</button></div></div></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script type="module">import {animate} from 'https://cdn.jsdelivr.net/npm/motion@latest/+esm'; window.gameMotion={animate};</script>
  <script>
  (()=>{
    const words=[['Sustainable','지속 가능한'],['Achieve','성취하다'],['Environment','환경'],['Opportunity','기회'],['Consider','고려하다'],['Essential','필수적인'],['Improve','개선하다'],['Challenge','도전'],['Knowledge','지식'],['Responsible','책임감 있는'],['Develop','발전시키다'],['Benefit','혜택'],['Determine','결정하다'],['Encourage','격려하다'],['Maintain','유지하다'],['Solution','해결책']];
    const $=id=>document.getElementById(id); let score=0,combo=0,wave=1,index=0,answerSide=0,deadline=0,raf=0,active=false,soundOn=true;let best=+localStorage.getItem('vocab-survival-best')||0;
    const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const updateBest=()=>{$('best').textContent=best;$('home-best').textContent=best};
    function shuffle(list){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
    function tone(freq,duration,type='sine'){if(!window.Howl)return null;const rate=8000,n=Math.floor(rate*duration),b=new ArrayBuffer(44+n*2),v=new DataView(b);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);for(let i=0;i<n;i++){const t=i/rate,e=1-i/n;const x=type==='square'?(Math.sin(2*Math.PI*freq*t)>0?1:-1):Math.sin(2*Math.PI*freq*t);v.setInt16(44+i*2,x*e*0.25*32767,true)}return new Howl({src:[URL.createObjectURL(new Blob([b],{type:'audio/wav'}))],volume:.35})}
    const sfx={ok:tone(740,.12),bad:tone(180,.2,'square'),start:tone(440,.1),record:tone(880,.35)};const play=name=>{if(soundOn&&sfx[name])sfx[name].play()};
    function enter(el){el.classList.remove('pulse');void el.offsetWidth;el.classList.add('pulse');if(window.gameMotion?.animate&&!reduced)window.gameMotion.animate(el,{opacity:[.4,1],y:[12,0]},{duration:.28,easing:'ease-out'})}
    function render(){const current=words[index%words.length],decoy=shuffle(words.filter(w=>w!==current))[0];answerSide=Math.random()<.5?0:1;const choices=answerSide?[decoy[0],current[0]]:[current[0],decoy[0]];$('meaning').textContent=current[1];$('left').lastElementChild.textContent=choices[0];$('right').lastElementChild.textContent=choices[1];$('score').textContent=score;$('combo').textContent=combo;$('wave').textContent=wave;$('left').className='answer';$('right').className='answer';const seconds=Math.max(2.7,5-(wave-1)*.18);deadline=performance.now()+seconds*1000;enter($('quiz-card'));tick()}
    function tick(){if(!active)return;const remain=Math.max(0,deadline-performance.now()),total=Math.max(2700,5000-(wave-1)*180);$('timer').style.transform=`scaleX(${remain/total})`;if(remain<=0){end('시간 초과!');return}raf=requestAnimationFrame(tick)}
    function burst(big=false){if(!window.confetti||reduced)return;confetti({particleCount:big?110:42,spread:big?80:55,origin:{y:.67},colors:['#62e7ff','#a885ff','#6ff5ab','#ffe17a'],disableForReducedMotion:true})}
    function choose(side){if(!active)return;cancelAnimationFrame(raf);const correct=side===answerSide,button=side?$('right'):$('left');button.classList.add(correct?'correct':'wrong');active=false;if(!correct){play('bad');setTimeout(()=>end('오답입니다!'),420);return}play('ok');combo++;score+=100+(combo-1)*30;wave=Math.floor(score/500)+1;burst(combo%3===0);index++;setTimeout(()=>{active=true;render()},330)}
    function begin(){score=0;combo=0;wave=1;index=0;$('home').classList.add('hidden');$('result').classList.add('hidden');$('game').classList.remove('hidden');active=true;play('start');render()}
    function end(message){active=false;cancelAnimationFrame(raf);const record=score>best;if(record){best=score;localStorage.setItem('vocab-survival-best',best);play('record');burst(true)}updateBest();$('game').classList.add('hidden');$('result').classList.remove('hidden');$('result-title').textContent=record?'신기록 달성!':message;$('result-copy').textContent=`WAVE ${wave} · 최고 콤보 ${combo}`;$('final-score').textContent=score;enter($('result'))}
    $('start').addEventListener('click',begin);$('retry').addEventListener('click',begin);$('left').addEventListener('click',()=>choose(0));$('right').addEventListener('click',()=>choose(1));$('sound-toggle').addEventListener('click',()=>{soundOn=!soundOn;Howler?.mute(!soundOn);$('sound-toggle').setAttribute('aria-pressed',String(soundOn));$('sound-toggle').setAttribute('aria-label',soundOn?'효과음 끄기':'효과음 켜기');$('sound-toggle').innerHTML=`<i data-lucide="${soundOn?'volume-2':'volume-x'}"></i>`;window.lucide?.createIcons()});addEventListener('keydown',e=>{if(!active&&(e.code==='Space'||e.code==='Enter')){e.preventDefault();begin()}if(active&&e.key==='ArrowLeft')choose(0);if(active&&e.key==='ArrowRight')choose(1)});window.lucide?.createIcons();updateBest();
  })();
  </script>
</body>
</html>
