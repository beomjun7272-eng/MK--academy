<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D 단어 문 통과</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#06101e;color:white;font-family:Arial}.ui{position:fixed;inset:0;pointer-events:none}.top{padding:16px;display:flex;justify-content:space-between}.card{background:#081a31dd;border:1px solid #63e7ff;border-radius:13px;padding:9px 13px}.q{position:fixed;top:68px;width:100%;text-align:center;font-size:clamp(28px,6vw,58px);font-weight:900}.timer{position:fixed;top:140px;left:25%;width:50%;height:10px;background:#26354e;border-radius:8px}.timer i{display:block;height:100%;background:#ff6480;transform-origin:left}.door{position:fixed;bottom:18%;width:42%;font-size:clamp(20px,4vw,38px);font-weight:900;text-align:center;text-shadow:0 3px 8px #000}.l{left:2%}.r{right:2%}.help{position:fixed;bottom:4%;width:100%;text-align:center}.heart{color:#ff7690}</style></head><body><div class="ui"><div class="top"><span class="card">점수 <b id="score">0</b></span><span class="card heart" id="life">♥ ♥ ♥</span><span class="card">방향키 이동</span></div><div class="q" id="q"></div><div class="timer"><i id="bar"></i></div><div class="door l" id="left"></div><div class="door r" id="right"></div><div class="help">사람 캐릭터를 방향키로 움직여 정답 문을 통과하세요</div></div><script type="module">import*as T from'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';import{GLTFLoader}from'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';const w=[['Sustainable','지속 가능한'],['Achieve','성취하다'],['Environment','환경'],['Opportunity','기회'],['Consider','고려하다'],['Essential','필수적인']];let n=0,answer=0,score=0,lives=3,end=0,busy=false,player,mixer,walk,idle,active;const $=x=>document.getElementById(x),keys={},s=new T.Scene(),c=new T.PerspectiveCamera(58,innerWidth/innerHeight,.1,100),r=new T.WebGLRenderer({antialias:true,powerPreference:'low-power'});r.setPixelRatio(Math.min(devicePixelRatio,1.25));r.setSize(innerWidth,innerHeight);document.body.prepend(r.domElement);c.position.set(0,3.5,8);s.background=new T.Color(0x06101e);s.fog=new T.Fog(0x06101e,9,35);s.add(new T.HemisphereLight(0xaeefff,0x06101e,2));let sun=new T.DirectionalLight(0xffffff,2);sun.position.set(4,7,4);s.add(sun);let floor=new T.Mesh(new T.PlaneGeometry(16,80),new T.MeshStandardMaterial({color:0x142b50}));floor.rotation.x=-Math.PI/2;floor.position.z=-28;s.add(floor);let lines=[];for(let z=5;z>-60;z-=4){let x=new T.Mesh(new T.BoxGeometry(10,.03,.09),new T.MeshBasicMaterial({color:0x54deff}));x.position.set(0,.02,z);s.add(x);lines.push(x)}function door(x,col){let a=new T.Mesh(new T.BoxGeometry(2.4,3.4,.35),new T.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:.45}));a.position.set(x,1.7,-7);s.add(a)}door(-2.7,0xa885ff);door(2.7,0x63e7ff);new GLTFLoader().load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/Soldier.glb',g=>{player=g.scene;player.scale.setScalar(1);player.position.set(0,0,0);s.add(player);mixer=new T.AnimationMixer(player);idle=mixer.clipAction(g.animations[0]);walk=mixer.clipAction(g.animations[1]);active=idle;idle.play()},undefined,()=>{$('q').textContent='모델을 불러오지 못했습니다. 새로고침하세요.'});function anim(move){if(!mixer)return;let next=move?walk:idle;if(next===active)return;next.reset().play();active.fadeOut(.15);next.fadeIn(.15);active=next}function next(){let a=w[n++%w.length],b=w.find(x=>x!==a);answer=Math.random()<.5?0:1;let v=answer?[b[0],a[0]]:[a[0],b[0]];$('q').textContent=a[1];$('left').textContent=v[0];$('right').textContent=v[1];window.current=a;end=performance.now()+6000;if(player)player.position.set(0,0,0)}function fail(){if(busy)return;busy=true;lives--;$('life').textContent='♥ '.repeat(lives)+'♡ '.repeat(3-lives);setTimeout(()=>{if(!lives){lives=3;score=0;$('life').textContent='♥ ♥ ♥'}busy=false;next()},700)}function pass(side){if(busy)return;busy=true;if(side===answer){score+=100;$('score').textContent=score;setTimeout(()=>{busy=false;next()},600)}else fail()}addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});let last=performance.now();function loop(t){let dt=(t-last)/1000;last=t;let rem=Math.max(0,end-t);$('bar').style.transform=`scaleX(${rem/6000})`;let dx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),dz=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);let moving=dx||dz;anim(moving);if(player&&!busy){player.position.x=T.MathUtils.clamp(player.position.x+dx*dt*4,-4.2,4.2);player.position.z=T.MathUtils.clamp(player.position.z+dz*dt*4,-8,3);if(moving)player.rotation.y=Math.atan2(dx,dz);if(player.position.z<-6.2&&Math.abs(player.position.x)>1.3)pass(player.position.x<0?0:1)}if(rem===0&&!busy)fail();for(let x of lines){x.position.z+=dt*2.5;if(x.position.z>6)x.position.z=-58}if(player){c.position.x+=(player.position.x-c.position.x)*.07;c.lookAt(player.position.x,1,-3)}if(mixer)mixer.update(dt);r.render(s,c);requestAnimationFrame(loop)}next();requestAnimationFrame(loop);</script></body></html>
