<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D 영단어 문 통과</title><style>html,body{margin:0;height:100%;background:#07101e;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none}#hud{display:flex;justify-content:space-between;padding:16px;font-weight:800;text-shadow:0 2px 8px #000}.pill{background:#081529cc;border:1px solid #62e7ff88;border-radius:99px;padding:9px 13px}.heart{color:#ff6d86;font-size:22px}.door-label{position:fixed;bottom:13%;font-size:clamp(19px,3vw,35px);font-weight:900;max-width:38%;text-align:center;color:#bff7ff;text-shadow:0 3px 10px #000}.left{left:5%}.right{right:5%}#hint{position:fixed;bottom:4%;width:100%;text-align:center;color:#d8e6ff}button{pointer-events:auto;background:#102648;color:#fff;border:1px solid #62e7ff;border-radius:12px;padding:9px 12px;font:inherit;cursor:pointer}#notes{position:fixed;inset:10% max(12px,20%);background:#081529f5;border:1px solid #62e7ff;border-radius:20px;padding:22px;overflow:auto;display:none;pointer-events:auto}#notes.show{display:block}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ffffff22;padding:9px;text-align:left}.banner{position:fixed;top:44%;width:100%;text-align:center;font-size:clamp(26px,6vw,58px);font-weight:900;text-shadow:0 3px 15px #000;opacity:0;transition:.2s}.banner.show{opacity:1}@media(max-width:600px){#hud{font-size:13px}.door-label{bottom:18%;max-width:42%}#hint{font-size:13px}}</style></head><body><div id="ui"><div id="hud"><span class="pill">SCORE <b id="score">0</b></span><span class="pill heart" id="lives">♥ ♥ ♥</span><span class="pill">STAGE <b id="stage">1</b></span><button id="noteBtn">오답노트</button></div><div id="left" class="door-label left"></div><div id="right" class="door-label right"></div><div id="hint">← → 키 또는 화면의 왼쪽·오른쪽을 눌러 문을 선택하세요</div><div id="banner" class="banner"></div><section id="notes"><button id="close">닫기</button><h2>오답노트</h2><p>틀린 단어는 이 기기에 자동 저장됩니다.</p><table><thead><tr><th>영단어</th><th>뜻</th><th>오답 횟수</th></tr></thead><tbody id="noteRows"></tbody></table></section></div><script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script><script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import Dexie from 'https://cdn.jsdelivr.net/npm/dexie@latest/dist/modern/dexie.mjs';
const words=[['Sustainable','지속 가능한'],['Achieve','성취하다'],['Environment','환경'],['Opportunity','기회'],['Consider','고려하다'],['Essential','필수적인'],['Improve','개선하다'],['Challenge','도전'],['Knowledge','지식'],['Responsible','책임감 있는'],['Develop','발전시키다'],['Benefit','혜택']];
const $=id=>document.getElementById(id),db=new Dexie('doorVocabulary');db.version(1).stores({mistakes:'word,meaning,count'});let score=0,lives=3,stage=1,answer=0,busy=false,current;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07101e);scene.fog=new THREE.Fog(0x07101e,8,42);const cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);cam.position.set(0,3.2,8);cam.lookAt(0,1,0);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0x8eeeff,0x07101e,2));const light=new THREE.DirectionalLight(0xa885ff,2);light.position.set(2,6,5);scene.add(light);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(18,90),new THREE.MeshStandardMaterial({color:0x142a4d,metalness:.25,roughness:.7}));floor.rotation.x=-Math.PI/2;floor.position.z=-25;scene.add(floor);for(let z=0;z>-60;z-=5){const line=new THREE.Mesh(new THREE.BoxGeometry(10,.03,.08),new THREE.MeshBasicMaterial({color:0x62e7ff}));line.position.set(0,.02,z);scene.add(line)}
const player=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.36,.85,5,10),new THREE.MeshStandardMaterial({color:0x62e7ff,emissive:0x064b62,emissiveIntensity:1}));body.position.y=.8;player.add(body);scene.add(player);
function door(x,color){const g=new THREE.Group(),frame=new THREE.Mesh(new THREE.BoxGeometry(2.25,3.3,.35),new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.35,metalness:.35}));frame.position.set(x,1.65,-5);g.add(frame);const inside=new THREE.Mesh(new THREE.BoxGeometry(1.85,2.8,.39),new THREE.MeshStandardMaterial({color:0x07101e,emissive:color,emissiveIntensity:.1}));inside.position.set(x,1.55,-4.78);g.add(inside);scene.add(g);return g}const doors=[door(-2.7,0xa885ff),door(2.7,0x62e7ff)];
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function beep(ok){if(!window.Howl)return;const data=ok?'UklGRl9vT19u':'UklGRl9vT19u';new Howl({src:['data:audio/wav;base64,'+data],volume:.15}).play()}
function next(){current=words[(stage-1)%words.length];const bad=shuffle(words.filter(w=>w!==current))[0];answer=Math.random()<.5?0:1;const c=answer?[bad[0],current[0]]:[current[0],bad[0]];$('left').textContent=c[0];$('right').textContent=c[1];$('stage').textContent=stage;$('score').textContent=score;doors.forEach((d,i)=>d.children.forEach(m=>m.material.emissiveIntensity=i===answer?.65:.18));player.position.set(0,0,0)}
async function wrong(){const old=await db.mistakes.get(current[0]);await db.mistakes.put({word:current[0],meaning:current[1],count:(old?.count||0)+1});lives--; $('lives').textContent='♥ '.repeat(lives)+'♡ '.repeat(3-lives);flash('오답! 목숨 -1','#ff6d86');if(!lives){flash('GAME OVER','#ff6d86');setTimeout(()=>{score=0;lives=3;stage=1;$('lives').textContent='♥ ♥ ♥';next()},1200)}else setTimeout(next,700)}
function flash(t,c){const b=$('banner');b.textContent=t;b.style.color=c;b.classList.add('show');setTimeout(()=>b.classList.remove('show'),650)}function choose(side){if(busy)return;busy=true;const target=side===0?-2.7:2.7;let n=0;const go=()=>{n+=.07;player.position.x=target*Math.min(n,1);player.position.z=-5*Math.min(n,1);if(n<1)requestAnimationFrame(go);else{if(side===answer){score+=100;stage++;flash('정답!','#6ff5ab');if(window.confetti)confetti({particleCount:36,spread:55,origin:{y:.65}});setTimeout(next,600)}else wrong();setTimeout(()=>busy=false,800)}};go()}
async function showNotes(){const rows=await db.mistakes.orderBy('count').reverse().toArray();$('noteRows').innerHTML=rows.map(x=>`<tr><td>${x.word}</td><td>${x.meaning}</td><td>${x.count}</td></tr>`).join('')||'<tr><td colspan="3">아직 오답이 없습니다.</td></tr>';$('notes').classList.add('show')}$('noteBtn').onclick=showNotes;$('close').onclick=()=>$('notes').classList.remove('show');addEventListener('keydown',e=>{if(e.key==='ArrowLeft')choose(0);if(e.key==='ArrowRight')choose(1)});renderer.domElement.onclick=e=>choose(e.clientX>innerWidth/2?1:0);addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});(function loop(){player.rotation.y=Math.sin(performance.now()/450)*.08;renderer.render(scene,cam);requestAnimationFrame(loop)})();next();
</script></body></html>
